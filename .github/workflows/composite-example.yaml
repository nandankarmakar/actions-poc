name: Composite Example Practice
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Load and Cache Dependencies
        uses: ./.github/actions/cached-deps
      - name: Lint Code
        run: npm run lint
      - name: Test Code
        run: npm run test
