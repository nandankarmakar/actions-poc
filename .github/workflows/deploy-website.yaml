name: Deploy Static Website in s3
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Build Code
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
  deploy:
    permissions:
      id-token: write
      contents: read
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout custom action Code
        uses: actions/checkout@v4
      - name: Install Custom action deps
        run: npm ci
        working-directory: ./.github/actions/deploy-s3-javascript
      - name: download artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: list Artifacts
        run: ls
      - name: Get AWS Permissions
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::721744297823:role/oidc-github-role
          aws-region: ap-south-1
      - name: deploy artifact
        uses: ./.github/actions/deploy-s3-javascript
        with:
          bucket: gha-custom-action-prac
          bucket-region: ap-south-1
          dist-folder: ./dist
      