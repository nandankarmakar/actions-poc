name: Unit Test
on: [workflow_dispatch]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  print-info:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Print Info
        run: echo "tests has been run"
